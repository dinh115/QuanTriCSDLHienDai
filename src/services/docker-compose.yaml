services:
  purchase-service:
    build: ./Purchase_Service
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=development
      - MONGODB_URI=mongodb://mongo:27017/purchase_service
      - USER_SERVICE_URL=http://user-service:3001
      - PRODUCT_SERVICE_URL=http://product-service:3002
      - PAYMENT_SERVICE_URL=http://payment-service:3003
      - CART_SERVICE_URL=http://cart-service:3004
      - VOUCHER_SERVICE_URL=http://voucher-service:3005
      - DEFAULT_SHIPPING_RATE=15000
      - EXPRESS_SHIPPING_RATE=30000
      - FREE_SHIPPING_THRESHOLD=100000
    depends_on:
      - mongo
      - user-service
      - product-service
      - payment-service
      - cart-service

  user-service:
    build: ./User_Service_MockUp
    ports:
      - "3001:3001"
    environment:
      - NODE_ENV=development
      - PORT=3001
      - JWT_SECRET=your-super-secret-jwt-key-change-in-production
      - JWT_EXPIRES_IN=24h
  product-service:
    build: ./Product_Service_MockUp
    ports:
      - "3002:3002"
    environment:
      - NODE_ENV=development
      - PORT=3002

  payment-service:
    build: ./Payment_Service_MockUp
    ports:
      - "3003:3003"
    environment:
      - NODE_ENV=development
      - PORT=3003


  cart-service:
    build: ./Cart_Service_MockUp
    ports:
      - "3004:3004"
    environment:
      - NODE_ENV=development
      - PORT=3004

  mongo:
    image: mongo:7.0
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

volumes:
  mongo_data: