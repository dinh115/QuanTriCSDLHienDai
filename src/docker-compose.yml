services:
  redis:
    image: redis:latest
    container_name: redis
    ports:
      - "6379:6379"

  cart_service:
    container_name: cart_service
    build:
      context: ./services/Cart_Service
    ports:
      - "3001:3001"
    depends_on:
      - redis

  frontend:
    container_name: frontend
    build:
      context: ./frontend
    ports:
      - "5000:5000"
    depends_on:
      - cart_service